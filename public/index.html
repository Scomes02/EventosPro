<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventosPro · Entradas para shows en vivo</title>
<meta name="description" content="Elegí tu butaca como en el cine y comprá entradas para shows en vivo. Proyecto demo de Cumbre Estudio.">
<meta name="theme-color" content="#14161B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="demo-bar">Proyecto demo · los pagos son simulados y no se cobra nada · <a href="#/login?demo=1">Probá con la cuenta demo</a></div>

  <header class="top">
    <div class="wrap top__in">
      <a href="#/" class="logo" aria-label="EventosPro, inicio">
        <svg viewBox="0 0 40 28" aria-hidden="true"><path d="M2 4a3 3 0 0 1 3-3h30a3 3 0 0 1 3 3v6a4 4 0 0 0 0 8v6a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-6a4 4 0 0 0 0-8z" fill="currentColor"/><path d="M27 4v20" stroke="var(--bg)" stroke-width="2" stroke-dasharray="2 2.5"/></svg>
        <span>Eventos<b>Pro</b></span>
      </a>
      <form class="search" id="search-form" role="search">
        <label class="sr" for="search-input">Buscar</label>
        <input id="search-input" type="search" placeholder="Buscá un artista, show o lugar" autocomplete="off">
      </form>
      <button class="menu-btn" id="menu-btn" aria-label="Abrir menú" aria-expanded="false" aria-controls="user-nav">
        <span></span><span></span>
      </button>
      <nav class="user-nav" id="user-nav" aria-label="Cuenta"></nav>
    </div>
  </header>

  <main id="app" class="wrap app" tabindex="-1"></main>

  <footer class="foot">
    <div class="wrap foot__in">
      <p><b>EventosPro</b> es un proyecto demo: los eventos, recintos y artistas son ficticios.</p>
      <p>Diseño y desarrollo: <a href="https://github.com/Scomes02" target="_blank" rel="noopener">Santiago Comes · Cumbre Estudio</a></p>
    </div>
  </footer>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
